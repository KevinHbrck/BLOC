<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Sport Timer</title>
<meta name="description" content="Minimalistischer Intervall-Timer für Workouts aus wiederverwendbaren Blöcken.">
<meta name="theme-color" content="#121214">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer">
<style>
/* Farbsystem: analoges Fahrzeug-Cockpit spät-80er/früh-90er (VW Golf 2, Audi 80, VDO-Instrumente) */
:root{
  color-scheme: light;
  --bg:#d9cfb7;
  --surface:#f0e9d6;
  --surface-2:#e2d6b6;
  --border:#b7a87d;
  --text:#2a2419;
  --text-dim:#6e6450;
  --accent:#a97c1f;
  --accent-text:#fbf3e0;
  --rest:#5c6b45;
  --rest-text:#f2f5e9;
  --blockrest:#4f6570;
  --danger:#93392b;
  --radius:12px;
  --tc-top:#fbf4e3; --tc-midtop:#ece0c2; --tc-midbot:#d9c99e; --tc-bot:#c4b284; --tc-text:#241f17;
  --shadow:0 1px 2px rgba(0,0,0,.10), 0 6px 16px rgba(0,0,0,.12);
  --bevel: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 3px rgba(0,0,0,.18);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#131211;
  --surface:#1d1b17;
  --surface-2:#272420;
  --border:#3a352b;
  --text:#e6ddc9;
  --text-dim:#8d8570;
  --accent:#b1502c;
  --accent-text:#17110c;
  --rest:#5c6b4a;
  --rest-text:#eef2e6;
  --blockrest:#4d5f68;
  --danger:#a4462f;
  --tc-top:#3c3830; --tc-midtop:#221f19; --tc-midbot:#17140f; --tc-bot:#0b0a08; --tc-text:#e7ded0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.4);
  --bevel: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 3px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#131211;
    --surface:#1d1b17;
    --surface-2:#272420;
    --border:#3a352b;
    --text:#e6ddc9;
    --text-dim:#8d8570;
    --accent:#b1502c;
    --accent-text:#17110c;
    --rest:#5c6b4a;
    --rest-text:#eef2e6;
    --blockrest:#4d5f68;
    --danger:#a4462f;
    --tc-top:#3c3830; --tc-midtop:#221f19; --tc-midbot:#17140f; --tc-bot:#0b0a08; --tc-text:#e7ded0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.4);
    --bevel: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 3px rgba(0,0,0,.4);
  }
}
body, .btn, .iconbtn, .theme-pick button, .sound-tile, h1, .phase-label, .block-label,
.section-title, .list-item .name, .list-item .sub, .wblock .name, .wblock .sub,
.block-pick .name, .block-pick .sub, .next-up, .chip, input, select{
  font-family:"Courier New",monospace;
  letter-spacing:.02em;
}
.card, .list-item, .wblock, .block-pick{
  border:1px solid var(--border);
  background:linear-gradient(180deg, var(--surface), var(--surface-2));
}
.btn, .iconbtn, .playbtn, .fab, .ctrl-btn, .theme-pick button, .sound-tile, .stepper, .wblock-actions button{
  box-shadow: var(--bevel), var(--shadow);
}
.iconbtn, .playbtn, .fab{
  border:1px solid var(--border);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
#app{ max-width:560px; margin:0 auto; padding:0 16px 110px; min-height:100%; }
h1,h2,h3{ margin:0 0 4px; }
.topbar{
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top) + 14px) 0 10px;
  background:linear-gradient(var(--bg) 70%, transparent);
}
.topbar h1{ font-size:20px; flex:1; }
.iconbtn{
  width:58px; height:58px; border-radius:16px; border:none;
  background:var(--surface); color:var(--text);
  display:flex; align-items:center; justify-content:center;
  font-size:25px; cursor:pointer; box-shadow:var(--shadow); flex-shrink:0;
}
.iconbtn:active{ transform:scale(.94); }
.back{ font-size:27px; }
.section-title{
  font-size:12px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--text-dim); margin:22px 4px 10px;
}
.card{
  background:var(--surface); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px; margin-bottom:12px;
}
.list-item{
  background:var(--surface); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 18px; margin-bottom:10px;
  display:flex; align-items:center; gap:12px; cursor:pointer; min-height:44px;
}
.list-item:active{ transform:scale(.99); }
.list-item .meta{ flex:1; min-width:0; }
.list-item .name{ font-weight:600; font-size:16px; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.list-item .sub{ font-size:13px; color:var(--text-dim); }
.chip{
  font-size:12px; font-weight:600; padding:3px 9px; border-radius:100px;
  background:var(--surface-2); color:var(--text-dim); white-space:nowrap;
}
.playbtn{
  width:46px; height:46px; border-radius:50%; border:none;
  background:var(--accent); color:var(--accent-text);
  display:flex; align-items:center; justify-content:center; font-size:18px;
  flex-shrink:0; cursor:pointer;
}
.playbtn:active{ transform:scale(.92); }
.empty{
  text-align:center; color:var(--text-dim); padding:60px 20px; font-size:14px;
}
.fab{
  position:fixed; right:calc(16px + env(safe-area-inset-right));
  bottom:calc(24px + env(safe-area-inset-bottom));
  width:66px; height:66px; border-radius:50%; border:none;
  background:var(--accent); color:var(--accent-text);
  font-size:32px; box-shadow:var(--shadow); cursor:pointer;
  display:flex; align-items:center; justify-content:center; z-index:4;
}
.fab:active{ transform:scale(.93); }

label{ display:block; font-size:13px; color:var(--text-dim); margin:14px 0 6px; }
label:first-child{ margin-top:0; }
input[type="text"], input[type="number"], select{
  width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:16px; outline:none;
}
input:focus, select:focus{ border-color:var(--accent); }
.row{ display:flex; gap:10px; }
.row > *{ flex:1; }
.numrow{ display:flex; align-items:center; gap:10px; }
.stepper{
  display:flex; align-items:center; background:var(--surface-2); border-radius:12px; border:1px solid var(--border);
  overflow:hidden; flex:1;
}
.stepper button{
  border:none; background:transparent; color:var(--text); font-size:24px; width:54px; height:54px; cursor:pointer;
}
.stepper button:active{ background:var(--border); }
.stepper input{ border:none; background:transparent; text-align:center; width:100%; padding:0; font-size:19px; font-weight:600; }
.btn{
  border:none; border-radius:16px; padding:17px 20px; font-size:17px; font-weight:600;
  cursor:pointer; width:100%; margin-top:14px;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn:active{ transform:scale(.98); }
.btn-primary{ background:var(--accent); color:var(--accent-text); }
.btn-secondary{ background:var(--surface-2); color:var(--text); }
.btn-danger{ background:transparent; color:var(--danger); }
.btn-ghost{ background:transparent; color:var(--text-dim); }
.quit-row{ margin-top:48px; padding-top:20px; border-top:1px solid var(--border); text-align:center; }
.quit-row .btn{ width:auto; padding:10px 20px; font-size:14px; margin:0 auto; }
.btn-row{ display:flex; gap:10px; }
.btn-row .btn{ margin-top:0; }

.block-pick{
  background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:14px 16px; margin-bottom:8px; display:flex; align-items:center; gap:10px; cursor:pointer;
}
.block-pick .name{ font-weight:600; flex:1; }
.block-pick .sub{ font-size:13px; color:var(--text-dim); }

.wblock{
  background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:14px 16px; margin-bottom:10px;
}
.wblock-top{ display:flex; align-items:center; gap:10px; }
.wblock-top .name{ font-weight:600; flex:1; }
.wblock-top .sub{ font-size:13px; color:var(--text-dim); }
.wblock-actions{ display:flex; gap:6px; }
.wblock-actions button{
  border:none; background:var(--surface-2); color:var(--text); width:40px; height:40px; border-radius:11px; font-size:16px; cursor:pointer;
}
.wblock-actions button:disabled{ opacity:.3; }
.gap-row{ display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:13px; color:var(--text-dim); }
.gap-row input{ width:70px; padding:9px 8px; font-size:15px; text-align:center; }

.toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); gap:12px; }
.toggle-row:last-child{ border-bottom:none; }
.toggle-row .label{ font-size:15px; }
.toggle-row .desc{ font-size:12px; color:var(--text-dim); margin-top:2px; }
.switch{ position:relative; width:54px; height:32px; flex-shrink:0; }
.switch input{ opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; }
.switch .track{ position:absolute; inset:0; background:var(--border); border-radius:100px; transition:.15s; }
.switch .thumb{ position:absolute; top:4px; left:4px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:.15s; }
.switch input:checked + .track{ background:var(--accent); }
.switch input:checked ~ .thumb{ transform:translateX(22px); }

.range-row{ padding:14px 0; border-bottom:1px solid var(--border); }
.range-row .label{ font-size:15px; display:flex; justify-content:space-between; margin-bottom:10px; }
.range-row .label span{ color:var(--text-dim); font-variant-numeric:tabular-nums; }
input[type="range"]{ width:100%; height:32px; accent-color:var(--accent); cursor:pointer; }

.theme-pick{ display:flex; flex-wrap:wrap; gap:8px; }
.theme-pick button{
  flex:1 1 auto; min-width:72px; padding:14px 8px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); font-size:15px; cursor:pointer;
}
.theme-pick button.active{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }

.installtip{
  background:var(--surface-2); border-radius:var(--radius); padding:14px 16px; margin:14px 0; font-size:13px; color:var(--text-dim); display:flex; gap:10px; align-items:flex-start;
}
.installtip a{ color:var(--accent); font-weight:600; text-decoration:none; }
.installtip button{ border:none; background:transparent; color:var(--text-dim); font-size:20px; cursor:pointer; padding:0 0 0 6px; width:28px; height:28px; flex-shrink:0; }

.step-row{ display:flex; gap:12px; margin-bottom:16px; }
.step-row:last-child{ margin-bottom:0; }
.step-num{
  width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--accent-text);
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0;
}
.step-text{ font-size:14.5px; line-height:1.55; padding-top:3px; }
.step-text b{ font-weight:700; }

/* ---- Player ---- */
.player{
  position:fixed; inset:0; background:var(--phase-bg, var(--bg)); z-index:50;
  display:flex; flex-direction:column; color:var(--phase-text, var(--text));
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition:background-color .35s ease;
}
.player-top{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 0; }
.player-top .exit{ background:rgba(128,128,128,.18); border:none; color:inherit; width:46px; height:46px; border-radius:50%; font-size:19px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.vol-popover{
  margin:10px 18px 0; background:rgba(128,128,128,.16); border-radius:16px; padding:10px 16px;
  display:flex; align-items:center; gap:12px;
}
.vol-popover input[type="range"]{ flex:1; height:36px; }
.vol-popover span{ font-size:13px; opacity:.85; width:38px; text-align:right; font-variant-numeric:tabular-nums; flex-shrink:0; }
.progressbar{ height:4px; background:rgba(128,128,128,.25); border-radius:100px; margin:14px 18px 0; overflow:hidden; }
.progressbar-fill{ height:100%; background:currentColor; border-radius:100px; transition:width .3s linear; }
.player-mid{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:10px 24px; }
.phase-label{ font-size:24px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.85; margin-bottom:6px; }
.block-label{ font-size:20px; font-weight:600; opacity:.75; margin-bottom:22px; min-height:26px; }
.next-up{ margin-top:26px; font-size:19px; font-weight:600; opacity:.65; min-height:24px; }
.rep-dots{ display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; justify-content:center; max-width:320px; }
.rep-dots span{ width:13px; height:13px; border-radius:3px; background:currentColor; opacity:.25; }
.rep-dots span.done{ opacity:.55; }
.rep-dots span.now{ opacity:1; width:16px; height:16px; }

/* Walzenzähler: mechanischer Rollenzähler wie ein echter Kilometerzähler */
.time{ display:flex; align-items:center; justify-content:center; }
.tc{
  display:inline-block; font-size:min(20vw,108px); font-weight:700; line-height:1;
  border-radius:7px; padding:0 .06em; margin:0 3px; min-width:.62em; text-align:center;
  position:relative;
  background:linear-gradient(180deg,var(--tc-top) 0%, var(--tc-midtop) 48%, var(--tc-midbot) 52%, var(--tc-bot) 100%);
  color:var(--tc-text);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.35);
}
.tc::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.5); }
.tc.sep{ background:none; box-shadow:none; color:var(--text); opacity:.55; min-width:auto; padding:0 .02em; }
.tc.sep::after{ content:none; }
.tc-window{ display:block; overflow:hidden; height:1.08em; line-height:1.08em; }
.tc-strip{ display:flex; flex-direction:column; }
.tc-d{ display:block; height:1.08em; line-height:1.08em; text-align:center; }
.tc-strip.rolling{ animation:odoRoll .42s cubic-bezier(.32,.85,.4,1) both; }
@keyframes odoRoll{
  0%{ transform:translateY(-1.08em); }
  72%{ transform:translateY(.05em); }
  100%{ transform:translateY(0); }
}
.player-controls{ display:flex; align-items:center; justify-content:center; gap:22px; padding:20px 24px calc(30px + env(safe-area-inset-bottom)); }
.ctrl-btn{
  border:none; background:rgba(128,128,128,.16); color:inherit; border-radius:50%;
  width:66px; height:66px; font-size:24px; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.ctrl-btn.main{ width:92px; height:92px; font-size:32px; background:currentColor; }
.ctrl-btn.main span{ color:var(--phase-bg,var(--bg)); }
.ctrl-btn:active{ transform:scale(.92); }
.done-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; padding:24px; }
.done-screen h2{ font-size:26px; margin-bottom:6px; }
.done-screen p{ color:inherit; opacity:.7; margin:0 0 24px; }

.confirm-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60; display:flex; align-items:flex-end; justify-content:center; }
.confirm-sheet{ background:var(--surface); color:var(--text); width:100%; max-width:560px; max-height:82vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); }
.confirm-sheet p{ color:var(--text-dim); font-size:14px; margin:4px 0 16px; }
.sound-tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0 4px; }
.sound-tile{
  padding:18px 8px; border-radius:14px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); font-size:15px; font-weight:600; cursor:pointer;
}
.sound-tile.active{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
.sound-tile:active{ transform:scale(.97); }

.hidden{ display:none !important; }
::selection{ background:var(--accent); color:var(--accent-text); }
</style>
</head>
<body>
<div id="app"></div>
<div id="playerRoot"></div>
<div id="overlayRoot"></div>

<script>
(function(){
"use strict";

/* ============ Storage ============ */
var DB_KEY = "sporttimer-data-v1";

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function defaultDB(){
  return {
    blocks: [],
    workouts: [],
    settings: { theme:"system", sound:true, soundStyle:"classic", vibration:true, keepAwake:true, countIn:true, volume:0.6 }
  };
}
/* Frühere Versionen kannten "retro"/"retro-dark"/"retro-light" als eigene Themes -
   das Cockpit-Design ist jetzt der Standard-Look, daher auf hell/dunkel abbilden. */
function migrateTheme(t){
  if(t==="retro-light") return "light";
  if(t==="retro" || t==="retro-dark") return "dark";
  return t;
}

var ICON_SAVE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
var ICON_TRASH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
var ICON_VOLUME = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.2 8.8a5 5 0 0 1 0 6.4"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>';
var ICON_DOWNLOAD = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>';
var ICON_HOME = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5l9-8 9 8"/><path d="M5.5 10v10h13V10"/><path d="M9.5 20v-6.5h5V20"/></svg>';
var ICON_EXIT = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>';

/* Auswählbare Klänge: jeweils Liste von Tönen {f:Frequenz, d:Verzögerung(ms), dur:Dauer(ms), v:Lautstärke-Faktor, type:Wellenform} */
var SOUND_STYLES = {
  classic: { label:"Klassisch",
    tick:[{f:880,d:0,dur:90,v:0.55,type:"sine"}],
    work:[{f:660,d:0,dur:170,v:1,type:"sine"}],
    rest:[{f:440,d:0,dur:170,v:0.85,type:"sine"}],
    blockrest:[{f:520,d:0,dur:170,v:0.85,type:"sine"}],
    prep:[{f:520,d:0,dur:170,v:0.85,type:"sine"}],
    done:[{f:660,d:0,dur:130,v:0.9,type:"sine"},{f:880,d:140,dur:130,v:0.9,type:"sine"},{f:1100,d:280,dur:240,v:1,type:"sine"}]
  },
  doppel: { label:"Doppelton",
    tick:[{f:1000,d:0,dur:60,v:0.4,type:"square"}],
    work:[{f:660,d:0,dur:90,v:0.9,type:"square"},{f:660,d:130,dur:90,v:0.9,type:"square"}],
    rest:[{f:420,d:0,dur:120,v:0.7,type:"square"}],

function loadDB(){
  try{
    var raw = localStorage.getItem(DB_KEY);
    if(!raw) return defaultDB();
    var parsed = JSON.parse(raw);
    var db = defaultDB();
    db.blocks = Array.isArray(parsed.blocks) ? parsed.blocks : [];
    db.workouts = Array.isArray(parsed.workouts) ? parsed.workouts : [];
    if(parsed.settings) Object.assign(db.settings, parsed.settings);
    db.settings.theme = migrateTheme(db.settings.theme);
    return db;
  }catch(e){ return defaultDB(); }
}

var state = { db: loadDB() };

function save(){ localStorage.setItem(DB_KEY, JSON.stringify(state.db)); }

/* ============ Helpers ============ */
function fmtTime(totalSec){
  totalSec = Math.max(0, Math.round(totalSec));
  var m = Math.floor(totalSec/60), s = totalSec%60;
  return m + ":" + (s<10?"0":"") + s;
}
function fmtDuration(totalSec){
  totalSec = Math.max(0, Math.round(totalSec));
  var h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  if(h>0) return h+" Std " + m + " Min";
  if(m>0) return m + " Min " + (s>0? s+" Sek": "");
  return s + " Sek";
}
function blockDuration(b){
  return b.reps * b.workSec + Math.max(0, b.reps-1) * b.restSec;
}
function findBlock(id){
  for(var i=0;i<state.db.blocks.length;i++) if(state.db.blocks[i].id===id) return state.db.blocks[i];
  return null;
}
function findWorkout(id){
  for(var i=0;i<state.db.workouts.length;i++) if(state.db.workouts[i].id===id) return state.db.workouts[i];
  return null;
}
function workoutDuration(w){
  var total = 0;
  for(var i=0;i<w.items.length;i++){
    var b = findBlock(w.items[i].blockId);
    if(!b) continue;
    total += blockDuration(b);
    if(i < w.items.length-1) total += (w.items[i].restAfterSec||0);
  }
  return total;
}
function esc(str){
  return String(str==null?"":str).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}

/* ============ Router ============ */
/* Eigener Navigations-Stack: "Zurück" geht immer zur tatsächlich zuvor besuchten Seite
   zurück (nicht zu einem fest codierten Ziel), egal von wo man eine Ansicht geöffnet hat. */
var navStack = [];
var backInProgress = false;

function go(hash){ location.hash = hash; }
function goBack(fallback){
  if(navStack.length > 1){
    backInProgress = true;
    navStack.pop();
    location.hash = navStack[navStack.length-1];
  } else {
    go(fallback);
  }
}
function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(Boolean);
  return parts;
}

window.addEventListener("hashchange", function(){
  var h = location.hash || "#home";
  if(backInProgress){
    backInProgress = false;
  } else if(navStack.length===0 || navStack[navStack.length-1] !== h){
    navStack.push(h);
  }
  render();
});
window.addEventListener("load", function(){
  if(!location.hash) location.hash = "#home";
  else if(navStack.length===0) navStack.push(location.hash);
  applyTheme();
  render();
  registerSW();
  maybeShowInstallTip();
});

/* ============ Direkter Installations-Button (Android/Chrome) ============ */
var deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  render();
});
window.addEventListener("appinstalled", function(){
  deferredInstallPrompt = null;
  render();
});
function triggerInstall(){
  if(!deferredInstallPrompt) return;
  var promptEvent = deferredInstallPrompt;
  deferredInstallPrompt = null;
  promptEvent.prompt();
  render();
}

/* ============ Theme ============ */
function applyTheme(){
  var t = state.db.settings.theme;
  if(t==="light" || t==="dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}

/* ============ Render dispatch ============ */
var app = document.getElementById("app");

function render(){
  if(document.getElementById("playerRoot").innerHTML) return; // don't re-render behind active player
  var parts = parseHash();
  var route = parts[0] || "home";
  if(route==="home") return renderHome();
  if(route==="blocks") return renderBlockList();
  if(route==="block") return renderBlockEdit(parts[1]);
  if(route==="workout") return renderWorkoutEdit(parts[1]);
  if(route==="settings") return renderSettings();
  if(route==="install") return renderInstallGuide();
  if(route==="play") return startPlayer(parts[1]);
  if(route==="playblock") return startBlockPlayer(parts[1]);
  return renderHome();
}

function topbar(title, opts){
  opts = opts || {};
  var back = opts.back ? '<button class="iconbtn back" data-back="'+opts.back+'">&#8249;</button>' : "";
  var home = opts.back ? '<button class="iconbtn" data-nav="#home" title="Zur Startseite">'+ICON_HOME+'</button>' : "";
  var right = opts.right || "";
  return '<div class="topbar">'+back+home+'<h1>'+esc(title)+'</h1>'+right+'</div>';
}

/* ============ Home: Workout list ============ */
function renderHome(){
  var ws = state.db.workouts.slice().sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });
  var items = ws.map(function(w){
    var count = w.items.length;
    return '<div class="list-item" data-nav="#workout/'+w.id+'">'+
      '<button class="playbtn" data-play="'+w.id+'" '+(count?'':'disabled style="opacity:.3"')+'>&#9658;</button>'+
      '<div class="meta"><div class="name">'+esc(w.name||"Ohne Namen")+'</div>'+
      '<div class="sub">'+count+' Block'+(count===1?'':'e')+' &middot; '+fmtDuration(workoutDuration(w))+'</div></div>'+
      '</div>';
  }).join("");
  if(!ws.length){
    items = '<div class="empty">Noch kein Workout angelegt.<br>Tippe unten rechts auf +, um loszulegen.</div>';
  }

  var bs = state.db.blocks.slice().sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });
  var blockItems = bs.map(function(b){
    return '<div class="list-item" data-nav="#block/'+b.id+'">'+
      '<button class="playbtn" data-playblock="'+b.id+'" title="Block einzeln starten">&#9658;</button>'+
      '<div class="meta"><div class="name">'+esc(b.name)+'</div>'+
      '<div class="sub">'+b.reps+'&times;'+b.workSec+'s/'+b.restSec+'s &middot; '+fmtDuration(blockDuration(b))+'</div></div>'+
      '</div>';
  }).join("");
  if(!bs.length){
    blockItems = '<div class="empty">Noch kein Block angelegt.<br>Tippe oben auf <b>&#9636;</b>, um einen anzulegen.</div>';
  }

  app.innerHTML =
    topbar("Workouts", { right:
      '<button class="iconbtn" data-nav="#blocks" title="Blöcke">&#9636;</button>'+
      '<button class="iconbtn" data-nav="#settings" title="Einstellungen">&#9881;</button>'
    }) +
    installTipHTML() +
    items +
    '<button class="fab" data-newworkout>+</button>' +
    '<div class="section-title" style="margin-top:34px;">Blöcke einzeln starten</div>' +
    blockItems +
    '<div class="quit-row"><button type="button" class="btn btn-ghost" data-quit>'+ICON_EXIT+' App verlassen</button></div>';
  bindCommon();
  app.querySelector("[data-newworkout]").addEventListener("click", function(){
    var w = { id:uid(), name:"Neues Workout", items:[], updatedAt:Date.now() };
    state.db.workouts.push(w); save();
    go("#workout/"+w.id);
  });
  app.querySelectorAll("[data-play]").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if(btn.disabled) return;
      go("#play/"+btn.getAttribute("data-play"));
    });
  });
  app.querySelectorAll("[data-playblock]").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      go("#playblock/"+btn.getAttribute("data-playblock"));
    });
  });
  app.querySelector("[data-quit]").addEventListener("click", function(){
    confirmSheet("App verlassen?", "Schließt die App, sofern der Browser das zulässt. Sonst kannst du den Tab danach einfach selbst schließen.", "Verlassen", function(){
      try{ window.close(); }catch(e){}
      setTimeout(function(){
        app.innerHTML = '<div class="empty" style="padding-top:140px;">Du kannst dieses Fenster jetzt schließen.<br><button type="button" class="btn btn-secondary" style="width:auto;margin-top:18px;padding:10px 20px;" data-backhome>Doch zurück zur App</button></div>';
        var backBtn = app.querySelector("[data-backhome]");
        if(backBtn) backBtn.addEventListener("click", function(){ go("#home"); });
      }, 250);
    });
  });
}

/* ============ Install tip (iOS / Android) ============ */
function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
}
function isAndroid(){
  return /android/i.test(navigator.userAgent);
}
function installTipHTML(){
  if(isStandalone()) return "";
  if(localStorage.getItem("sporttimer-tip-hidden")==="1") return "";
  if(deferredInstallPrompt){
    return '<div class="installtip"><div><b>Für dauerhaften Speicher installieren</b><br>Ein Tap und die App liegt auf deinem Startbildschirm.'+
      '<div style="margin-top:10px;"><button type="button" class="btn btn-primary" style="margin:0;width:auto;padding:11px 18px;font-size:14px;" data-install-now>'+ICON_DOWNLOAD+' Jetzt installieren</button></div></div>'+
      '<button data-hidetip>&times;</button></div>';
  }
  if(!isIOS() && !isAndroid()) return "";
  var txt = isIOS()
    ? 'Für dauerhaften Speicher: Teile-Symbol &#8593; antippen und <b>„Zum Home-Bildschirm"</b> wählen.'
    : 'Für dauerhaften Speicher: Menü &#8942; öffnen und <b>„App installieren"</b> wählen.';
  return '<div class="installtip"><div>'+txt+' <a href="#install">Anleitung ansehen</a></div>'+
    '<button data-hidetip>&times;</button></div>';
}
function maybeShowInstallTip(){}

/* ============ Common bindings ============ */
function bindCommon(){
  app.querySelectorAll("[data-nav]").forEach(function(el){
    el.addEventListener("click", function(ev){
      if(ev.target.closest("[data-play]") || ev.target.closest("[data-playblock]")) return;
      go(el.getAttribute("data-nav"));
    });
  });
  var backBtn = app.querySelector("[data-back]");

function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }

function stepperHTML(name, value, min, max, step){
  return '<div class="stepper" data-min="'+min+'" data-max="'+max+'" data-step="'+step+'">'+
    '<button type="button" data-dec>&minus;</button>'+
    '<input type="number" id="'+name+'" value="'+value+'" inputmode="numeric">'+
    '<button type="button" data-inc>&plus;</button>'+
    '</div>';
}
function bindSteppers(root, onChange){
  root.querySelectorAll(".stepper").forEach(function(st){
    var input = st.querySelector("input");
    var min = parseInt(st.getAttribute("data-min")), max = parseInt(st.getAttribute("data-max")), step = parseInt(st.getAttribute("data-step"));
    st.querySelector("[data-dec]").addEventListener("click", function(){
      input.value = clamp((parseInt(input.value)||0) - step, min, max);
      onChange();
    });
    st.querySelector("[data-inc]").addEventListener("click", function(){
      input.value = clamp((parseInt(input.value)||0) + step, min, max);
      onChange();
    });
    input.addEventListener("change", function(){
      input.value = clamp(parseInt(input.value)||min, min, max);
      onChange();
    });
    input.addEventListener("focus", function(){ input.select(); });
  });
}

/* ============ Audio & Haptics ============ */
var actx = null;
function audioCtx(){
  if(!actx){ var AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
  return actx;
}
function noiseBurst(ctx, gain, n, now){
  var durSec = n.dur/1000;
  var buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate*(durSec+0.05)), ctx.sampleRate);
  var data = buf.getChannelData(0);
  for(var i=0;i<data.length;i++){ data[i] = Math.random()*2-1; }
  var src = ctx.createBufferSource();
  src.buffer = buf;
  var filter = ctx.createBiquadFilter();
  filter.type = n.filterType || "bandpass";
  filter.frequency.value = n.f || 1200;
  filter.Q.value = n.q || 1;
  src.connect(filter); filter.connect(gain);
  src.start(now);
  src.stop(now + durSec + 0.05);
}
/* Spielt eine Notiz {f,dur,v,type,sweepTo,noise,filterType,q}: einfacher Ton, Pitch-Sweep oder gefiltertes Rauschen (für Trommel/Gong-artige Klänge jenseits reiner Oszillator-Beeps) */
function tone(n){
  if(!state.db.settings.sound) return;
  var ctx = audioCtx();
  if(!ctx) return;
  if(ctx.state==="suspended") ctx.resume();
  var level = (n.v==null?0.7:n.v) * (state.db.settings.volume!=null ? state.db.settings.volume : 1);
  if(level<=0) return;
  var now = ctx.currentTime;
  var gain = ctx.createGain();
  gain.connect(ctx.destination);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(level, now+0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + n.dur/1000);

  if(n.noise){
    noiseBurst(ctx, gain, n, now);
    return;
  }
  var osc = ctx.createOscillator();
  osc.type = n.type || "sine";
  osc.frequency.setValueAtTime(n.f, now);
  if(n.sweepTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1,n.sweepTo), now + n.dur/1000);
  osc.connect(gain);
  osc.start(now);
  osc.stop(now + n.dur/1000 + 0.02);
}
function currentSoundStyle(){
  return SOUND_STYLES[state.db.settings.soundStyle] || SOUND_STYLES.classic;
}
function playNotes(notes){
  if(!notes) return;
  notes.forEach(function(n){
    setTimeout(function(){ tone(n); }, n.d);
  });
}
function tick(){ playNotes(currentSoundStyle().tick); }
function phaseBeep(kind){ playNotes(currentSoundStyle()[kind]); }
function vibrate(pattern){
  if(!state.db.settings.vibration) return;
  if(navigator.vibrate) try{ navigator.vibrate(pattern); }catch(e){}
}

/* ============ Wake Lock ============ */
var wakeLock = null;
function requestWakeLock(){
  if(!state.db.settings.keepAwake) return;
  if(!("wakeLock" in navigator)) return;
  navigator.wakeLock.request("screen").then(function(wl){ wakeLock = wl; }).catch(function(){});
}
function releaseWakeLock(){
  if(wakeLock){ wakeLock.release().catch(function(){}); wakeLock = null; }
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState==="visible" && playerState && playerState.running) requestWakeLock();
});

/* ============ Timer engine ============ */
function buildSteps(w){
  var steps = [];
  steps.push({ phase:"prep", label:"Bereit machen", duration:5, blockName: (function(){
    var b = findBlock(w.items[0] ? w.items[0].blockId : null); return b?b.name:"";
  })() });
  for(var i=0;i<w.items.length;i++){
    var it = w.items[i];
    var b = findBlock(it.blockId);
    if(!b) continue;
    for(var r=0;r<b.reps;r++){
      steps.push({ phase:"work", label:b.name, blockName:b.name, duration:b.workSec, rep:r+1, totalReps:b.reps });
      if(r < b.reps-1){
        steps.push({ phase:"rest", label:b.name, blockName:b.name, duration:b.restSec, rep:r+1, totalReps:b.reps });
      }
    }
    if(i < w.items.length-1 && it.restAfterSec>0){
      var nb = findBlock(w.items[i+1].blockId);
      steps.push({ phase:"blockrest", label:"Blockpause", blockName: nb?nb.name:"", duration:it.restAfterSec });
    }
  }
  steps.push({ phase:"done", label:"Fertig", duration:0 });
  return steps;
}

var playerState = null;

function workoutForSource(source){
  if(!source) return null;
  if(source.type==="block"){
    var b = findBlock(source.id);
    return b ? { id:"quick-"+b.id, name:b.name, items:[{blockId:b.id, restAfterSec:0}] } : null;
  }
  return findWorkout(source.id);
}

function startPlayer(workoutId){ launchFromSource({ type:"workout", id:workoutId }); }
function startBlockPlayer(blockId){ launchFromSource({ type:"block", id:blockId }); }

function launchFromSource(source){
  var w = workoutForSource(source);
  if(!w || !w.items.length){ go("#home"); return; }
  launchPlayer(w, source);
}

function launchPlayer(w, source){
  var steps = buildSteps(w);
  playerState = {
    workout: w, steps: steps, idx: 0,
    running: true, paused: false,
    endAt: 0, remainingMs: steps[0].duration*1000,
    rafId: null, source: source
  };
  document.getElementById("playerRoot").innerHTML = playerTemplate();
  bindPlayerControls();
  enterStep(0);
  requestWakeLock();
}

function phaseVars(phase){
  if(phase==="work") return { bg:"var(--accent)", text:"var(--accent-text)", label:"Arbeit" };
  if(phase==="rest") return { bg:"var(--rest)", text:"var(--rest-text)", label:"Pause" };
  if(phase==="blockrest") return { bg:"var(--blockrest)", text:"#ffffff", label:"Blockpause" };
  if(phase==="prep") return { bg:"var(--blockrest)", text:"#ffffff", label:"Los geht's" };
  return { bg:"var(--bg)", text:"var(--text)", label:"" };
}

function playerTemplate(){
  var vol = Math.round((state.db.settings.volume!=null?state.db.settings.volume:1)*100);
  return '<div class="player" id="playerEl">'+
    '<div class="player-top">'+
      '<button class="exit" data-exit>&times;</button>'+
      '<div style="font-size:13px;opacity:.7" id="pl-counter"></div>'+
      '<button class="exit" data-vol-toggle title="Lautstärke">'+ICON_VOLUME+'</button>'+
    '</div>'+
    '<div class="vol-popover hidden" id="pl-vol-pop">'+ICON_VOLUME+
      '<input type="range" id="pl-vol-range" min="0" max="100" step="5" value="'+vol+'">'+
      '<span id="pl-vol-val">'+vol+'%</span>'+
    '</div>'+
    '<div class="progressbar"><div class="progressbar-fill" id="pl-progress" style="width:0%"></div></div>'+
    '<div id="pl-body" class="player-mid"></div>'+
    '</div>';
}

function stepBodyHTML(step){
  if(step.phase==="done"){
    var total = fmtDuration(workoutDuration(playerState.workout));
    return '<div class="done-screen"><h2>Workout geschafft!</h2><p>'+esc(playerState.workout.name)+' &middot; '+total+'</p>'+
      '<div class="btn-row" style="width:100%;max-width:300px;">'+
        '<button class="btn btn-secondary" data-again>&#8635; Nochmal</button>'+
        '<button class="btn btn-primary" data-finish>Fertig</button>'+
      '</div></div>';
  }
  var pv = phaseVars(step.phase);
  var repInfo = step.totalReps ? '<div class="rep-dots" id="pl-dots"></div>' : "";
  return '<div class="phase-label">'+pv.label+'</div>'+
    '<div class="block-label">'+esc(step.blockName||"")+(step.totalReps? " &middot; "+step.rep+"/"+step.totalReps : "")+'</div>'+
    '<div class="time" id="pl-time">'+renderTimeCells(fmtTime(step.duration))+'</div>'+
    repInfo+
    '<div class="next-up" id="pl-next"></div>'+
    '<div class="player-controls">'+
      '<button class="ctrl-btn" data-skip title="Weiter">&#9197;</button>'+
      '<button class="ctrl-btn main" id="pl-playpause" title="Pause"><span>&#10074;&#10074;</span></button>'+
      '<button class="ctrl-btn" data-restart title="Phase neu">&#8635;</button>'+
    '</div>';
}

function nextStepPreview(idx){
  var steps = playerState.steps;
  if(idx+1 >= steps.length) return "";
  var n = steps[idx+1];
  if(n.phase==="done") return "Danach: Fertig";
  var pv = phaseVars(n.phase);
  return "Als nächstes: "+pv.label+(n.blockName? " &middot; "+esc(n.blockName):"")+" ("+fmtTime(n.duration)+")";
}

function enterStep(idx){
  var steps = playerState.steps;
  if(idx >= steps.length) idx = steps.length-1;
  playerState.idx = idx;
  var step = steps[idx];
  var el = document.getElementById("playerEl");
  var pv = phaseVars(step.phase);
  el.style.setProperty("--phase-bg", pv.bg);
  el.style.setProperty("--phase-text", pv.text);
  document.getElementById("pl-body").innerHTML = stepBodyHTML(step);
  document.getElementById("pl-counter").textContent = (idx+1)+" / "+steps.length;

  if(step.phase!=="done"){
    playerState.remainingMs = step.duration*1000;
    playerState.endAt = Date.now() + playerState.remainingMs;
    playerState.paused = false;
    playerState.beepedAt = {};
    document.getElementById("pl-next").innerHTML = nextStepPreview(idx);
    updateDots(step);
    if(step.phase==="work") phaseBeep("work");
    else if(step.phase==="rest") phaseBeep("rest");
    else if(step.phase==="blockrest") phaseBeep("blockrest");
    else if(step.phase==="prep") phaseBeep("prep");
    vibrate(step.phase==="work" ? [40] : [20,60,20]);
    bindPlayPause();
    tickLoop();
  } else {
    releaseWakeLock();
    phaseBeep("done");
    vibrate([60,80,60,80,120]);
    var doneBody = document.getElementById("pl-body");
    var finishBtn = doneBody.querySelector("[data-finish]");
    if(finishBtn) finishBtn.addEventListener("click", exitPlayer);
    var againBtn = doneBody.querySelector("[data-again]");
    if(againBtn) againBtn.addEventListener("click", function(){
      var source = playerState.source;
      if(playerState.rafId) cancelAnimationFrame(playerState.rafId);
      launchFromSource(source);
    });
  }
  updateProgress();
}

function updateDots(step){
  var wrap = document.getElementById("pl-dots");
  if(!wrap) return;
  var html = "";
  for(var i=1;i<=step.totalReps;i++){
    var cls = i<step.rep ? "done" : (i===step.rep ? "now":"");
    html += '<span class="'+cls+'"></span>';
  }
  wrap.innerHTML = html;
}

function updateProgress(){
  var steps = playerState.steps;
  var totalDur = 0, elapsed = 0;
  for(var i=0;i<steps.length-1;i++){ totalDur += steps[i].duration; }
  for(i=0;i<playerState.idx;i++){ elapsed += steps[i].duration; }
  var step = steps[playerState.idx];
  if(step && step.phase!=="done"){
    var doneMs = (step.duration*1000 - Math.max(0,playerState.remainingMs));
    elapsed += doneMs/1000;
  } else {
    elapsed = totalDur;
  }
  var pct = totalDur>0 ? Math.min(100, elapsed/totalDur*100) : 100;
  var bar = document.getElementById("pl-progress");
  if(bar) bar.style.width = pct+"%";
}

/* Walzenzähler-Ziffern: jede Ziffer eine eigene Walze. Beim Wechsel rollt die neue Zahl von
   oben nach unten ein, die alte rutscht nach unten weg - wie bei einem echten Kilometerzähler. */
function renderTimeCells(text){
  var html = "";
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    if(ch===":"){
      html += '<span class="tc sep">:</span>';
    } else {
      html += '<span class="tc" data-digit="'+ch+'"><span class="tc-window"><span class="tc-strip"><span class="tc-d">'+ch+'</span></span></span></span>';
    }
  }
  return html;
}
function rollCell(cell, newCh){
  if(cell.getAttribute("data-digit")===newCh) return;
  var oldCh = cell.getAttribute("data-digit");
  cell.setAttribute("data-digit", newCh);
  var strip = cell.querySelector(".tc-strip");
  strip.innerHTML = '<span class="tc-d">'+esc(newCh)+'</span><span class="tc-d">'+esc(oldCh)+'</span>';
  strip.classList.remove("rolling");
  void strip.offsetHeight;
  strip.classList.add("rolling");
  strip.addEventListener("animationend", function done(){
    strip.classList.remove("rolling");
    strip.innerHTML = '<span class="tc-d">'+esc(newCh)+'</span>';
    strip.removeEventListener("animationend", done);
  });
}
function updateTimeCells(container, text){
  var chars = text.split("");
  if(container.children.length !== chars.length){
    container.innerHTML = renderTimeCells(text);
    return;
  }
  for(var i=0;i<chars.length;i++){
    var cell = container.children[i];
    if(cell.classList.contains("sep")) continue;
    rollCell(cell, chars[i]);
  }
}

function tickLoop(){
  if(playerState.rafId) cancelAnimationFrame(playerState.rafId);
  function frame(){
    if(!playerState || playerState.paused){ return; }
    var step = playerState.steps[playerState.idx];
    if(!step || step.phase==="done") return;
    var remaining = playerState.endAt - Date.now();
    if(remaining <= 0){
      enterStep(playerState.idx+1);
      return;
    }
    playerState.remainingMs = remaining;
    var remSec = Math.ceil(remaining/1000);
    var timeEl = document.getElementById("pl-time");
    if(timeEl) updateTimeCells(timeEl, fmtTime(remSec));
    if(state.db.settings.countIn && remSec<=3 && remSec>=1 && playerState.beepedAt[remSec]!==true){
      playerState.beepedAt[remSec] = true;
      tick();
    }
    updateProgress();
    playerState.rafId = requestAnimationFrame(frame);
  }
  frame();
}

function bindPlayPause(){
  var btn = document.getElementById("pl-playpause");
  if(!btn) return;
  btn.onclick = function(){
    if(playerState.paused){
      playerState.paused = false;
      playerState.endAt = Date.now() + playerState.remainingMs;
      btn.querySelector("span").innerHTML = "&#10074;&#10074;";
      requestWakeLock();
      tickLoop();
    } else {
      playerState.paused = true;
      btn.querySelector("span").innerHTML = "&#9658;";
      if(playerState.rafId) cancelAnimationFrame(playerState.rafId);
    }
  };
}

function bindPlayerControls(){
  var root = document.getElementById("playerRoot");
  root.addEventListener("click", function(e){
    if(e.target.closest("[data-exit]")){
      confirmSheet("Workout beenden?", "Der Fortschritt geht verloren.", "Beenden", exitPlayer);
    }
    if(e.target.closest("[data-skip]")){
      if(playerState.rafId) cancelAnimationFrame(playerState.rafId);
      enterStep(playerState.idx+1);
    }
    if(e.target.closest("[data-restart]")){
      var step = playerState.steps[playerState.idx];
      playerState.remainingMs = step.duration*1000;
      playerState.endAt = Date.now() + playerState.remainingMs;
      playerState.paused = false;
      if(playerState.rafId) cancelAnimationFrame(playerState.rafId);
      tickLoop();
    }
    if(e.target.closest("[data-vol-toggle]")){
      document.getElementById("pl-vol-pop").classList.toggle("hidden");
    }
  });
  var volRange = document.getElementById("pl-vol-range");
  var volVal = document.getElementById("pl-vol-val");
  volRange.addEventListener("input", function(){
    state.db.settings.volume = parseInt(volRange.value)/100;
    volVal.textContent = volRange.value+"%";
    save();
  });
  volRange.addEventListener("change", function(){
    phaseBeep(playerState.steps[playerState.idx].phase==="done" ? "done" : "work");
  });
}

function exitPlayer(){
  if(playerState && playerState.rafId) cancelAnimationFrame(playerState.rafId);
  playerState = null;
  releaseWakeLock();
  document.getElementById("playerRoot").innerHTML = "";
  go("#home");
  render();
}

/* ============ Service worker ============ */
function registerSW(){
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  }
}

})();
</script>
