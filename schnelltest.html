<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOC Schnelltest</title>
<style>
  :root { --bg:#f5f5f2; --text:#1d1d1f; --dim:#6b6b70; --ok:#1f9d63; --fail:#d6453d; --card:#fff; --rule:#e2e2dd; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121214; --text:#f2f2f2; --dim:#a0a0a6; --card:#1d1d20; --rule:#2e2e33; } }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { display:flex; gap:20px; padding:16px; flex-wrap:wrap; }
  .links { flex:1 1 320px; min-width:0; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { color:var(--dim); margin:0 0 12px; }
  button { font:inherit; padding:10px 16px; border-radius:10px; border:0; background:#ff5a36; color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  #summe { font-weight:700; margin:12px 0; }
  #summe.ok { color:var(--ok); } #summe.fail { color:var(--fail); }
  ol { padding-left:22px; margin:0; }
  li { margin:4px 0; }
  li.ok::marker { color:var(--ok); } li.fail { color:var(--fail); }
  li small { display:block; color:var(--dim); }
  iframe { width:390px; height:780px; border:1px solid var(--rule); border-radius:14px; background:#fff; flex:0 0 auto; max-width:100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="links">
    <h1>BLOC Schnelltest</h1>
    <p>Klickt sich einmal durch die wichtigsten Wege der App. Läuft nur lokal (localhost). Dein gespeicherter Stand wird vorher
      beiseitegelegt und danach wiederhergestellt.</p>
    <button id="los" type="button">Test starten</button>
    <div id="summe"></div>
    <ol id="liste"></ol>
  </div>
  <iframe id="app" title="App im Test"></iframe>
</div>
<script>
(function () {
  "use strict";
  var KEY = "sporttimer-data-v1";
  var iframe = document.getElementById("app"), liste = document.getElementById("liste"), summe = document.getElementById("summe");
  var W = null, D = null, fehler = [];
  var lokal = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol === "file:";

  function warte(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function bis(fn, ms, was) {
    var t0 = Date.now();
    while (Date.now() - t0 < (ms || 4000)) {
      try { var v = fn(); if (v) return v; } catch (e) {}
      await warte(50);
    }
    throw new Error("Zeitüberschreitung: " + (was || "Bedingung"));
  }
  function $(s) { return D.querySelector(s); }
  function $$(s) { return Array.prototype.slice.call(D.querySelectorAll(s)); }
  function klick(s) { var el = typeof s === "string" ? $(s) : s; if (!el) throw new Error("nicht gefunden: " + s); el.click(); return el; }
  function pruefe(b, text) { if (!b) throw new Error(text); }
  function sichtbar(el) { return el && el.style.display !== "none" && !el.hidden && el.offsetParent !== null; }
  function eingeben(el, wert) { el.value = wert; el.dispatchEvent(new W.Event("input", { bubbles: true })); el.dispatchEvent(new W.Event("change", { bubbles: true })); }

  function laden() {
    return new Promise(function (ok) {
      iframe.onload = function () {
        W = iframe.contentWindow; D = W.document;
        W.addEventListener("error", function (e) { fehler.push(String(e.message || e)); });
        var alt = W.console.error;
        W.console.error = function () { fehler.push(Array.prototype.join.call(arguments, " ")); return alt.apply(W.console, arguments); };
        setTimeout(ok, 400);
      };
      iframe.src = "index.html?schnelltest=" + Date.now() + "&lang=de#home";   // Texte immer deutsch, egal welche Browsersprache
    });
  }
  // Filterkarte (Air, Studio, Mobility & Stretch, Summit) aufklappen, falls sie zu ist
  async function filterAuf() {
    if (!$(".af-body")) klick(".af-kopf");
    await bis(function () { return $(".af-body"); }, 2000, "Filterkarte offen");
  }
  async function heim() { await laden(); await bis(function () { return $(".area-tile"); }, 5000, "Startseite"); }

  var TESTS = [
    ["Einführung: nur beim ersten Start, vier Seiten mit Zahlen, danach in den Einstellungen", async function () {
      await heim();   // der Test startet ohne gespeicherte Daten - wie eine neue Installation
      await bis(function () { return $("#overlayRoot .intro-sheet"); }, 3000, "Einführung beim ersten Start");
      var titel = [];
      for (var i = 0; i < 4; i++) {
        titel.push($(".intro-seite h2").textContent);
        pruefe($$(".intro-punkte i").length === 4 && $$(".intro-punkte i")[i].classList.contains("an"), "Punkt " + (i + 1) + " nicht markiert");
        pruefe(!/\{\w+\}/.test($(".intro-seite p").textContent), "Zahl fehlt: " + $(".intro-seite p").textContent);
        if (i > 0) pruefe(/\d/.test($(".intro-seite p").textContent), "keine Anzahl auf Seite " + (i + 1));
        klick("[data-introweiter]");
      }
      pruefe(titel.join(" | ") === "Willkommen bei BLOC | Katalog | Summit | Mobility & Stretch", "Seiten: " + titel.join(" | "));
      pruefe(!$("#overlayRoot .intro-sheet"), "„Los geht's“ schließt die Einführung nicht");
      await heim();
      await warte(500);
      pruefe(!$("#overlayRoot .intro-sheet"), "Einführung kommt nach dem Neuladen wieder");
      klick('[data-nav="#settings"]');
      klick(await bis(function () { return $("[data-intro]"); }, 3000, "Einstellungen: Einführung ansehen"));
      await bis(function () { return $("#overlayRoot .intro-sheet"); }, 2000, "Einführung aus den Einstellungen");
      klick("[data-introweg]");
      pruefe(!$("#overlayRoot .intro-sheet"), "„Überspringen“ schließt nicht");
    }],
    ["Startseite: Workouts vorn, vier weitere Bereiche (Lauf), Wochenzeile", async function () {
      await heim();
      pruefe($$(".area-tile[data-bereich]").length === 5, "erwartet 5 Bereichs-Kacheln, gefunden " + $$(".area-tile[data-bereich]").length);
      pruefe($('.area-tile[data-bereich="intervall"][data-nav="#intervall"]'), "Timer fehlt als Bereich auf der Startseite");
      pruefe($(".area-tile.gross") && $(".area-tile.gross").getAttribute("data-nav") === "#katalog", "Der Katalog steht nicht hervorgehoben vorn");
      pruefe($$(".area-tile[data-bereich]").map(function (e) { return e.getAttribute("data-bereich"); }).join(",") === "katalog,intervall,reps,run,warm", "Reihenfolge der Bereiche: " + $$(".area-tile[data-bereich]").map(function (e) { return e.getAttribute("data-bereich"); }).join(","));
      pruefe($$(".area-gruppe .area-tile.zeile[data-bereich]").length === 4, "die übrigen vier Bereiche fehlen in der Liste");
      pruefe(!$('[data-nav^="#timers/"]'), "eigene Timer-Zeile steht noch auf der Startseite");
      pruefe(!$("[data-surprise]"), "Überrasch mich steht noch auf der Startseite");
      pruefe($(".woche"), "Wochenzeile fehlt");
    }],
    ["Katalog: Reiterzeile Workouts · Übungen · Meine, zu Beginn nur die Überschriften, Überrasch mich in der ersten Leiste", async function () {
      klick('[data-nav="#katalog"]');
      await bis(function () { return $$("[data-kattab]").length === 3; }, 3000, "Reiter");
      var tabs = $$("[data-kattab]").map(function (b) { return b.textContent.trim(); }).join(" · ");
      pruefe(tabs === "Workouts · Übungen · Meine", "Reihenfolge ist " + tabs);
      pruefe($(".rz") && !$(".lib-tabs-card") && !$(".surprise-card"), "Reiterzeile fehlt oder die große Karte steht noch da");
      pruefe(/Katalog/.test($(".topbar h1").textContent), "Titel ist nicht „Katalog“");
      klick('[data-kattab="workouts"]');
      pruefe($$(".lib-card").length >= 20, "zu wenige Workouts: " + $$(".lib-card").length);
      var gr = $$("details.kat-gr");
      pruefe(gr.length >= 6 && gr.every(function (d) { return !d.open && sichtbar(d); }), "Workouts: zu Beginn sollen nur die Überschriften stehen (" + gr.length + " Bereiche)");
      klick(gr[0].querySelector("summary"));
      pruefe(gr[0].open && $$(".lib-card").filter(sichtbar).length >= 1, "Antippen klappt den Bereich nicht auf");
      klick(gr[0].querySelector("summary"));
      pruefe(!gr[0].open, "zweites Antippen klappt nicht zu");
      var sl = $(".sp-leiste[data-surprise]");
      pruefe(sl && !$(".topbar .sp-leiste"), "Überrasch mich fehlt als Leiste unter den Reitern (Workouts)");
      pruefe(sl.getBoundingClientRect().height <= 50, "Überrasch-mich-Leiste ist nicht schmal: " + Math.round(sl.getBoundingClientRect().height) + " px");
      // Sortierung A–Z: kleiner Schalter in der Kopfzeile der Filterkarte; sortiert wird innerhalb der Bereiche
      pruefe($(".air-filter .af-az") && !$(".air-filter .fc-seg"), "A–Z-Schalter fehlt oder der Sortier-Block steht noch in der Karte");
      klick(".af-az");
      await bis(function () { return $(".af-az.on"); }, 2000, "A–Z an");
      var az = $$("details.kat-gr").every(function (d) {
        var n = Array.prototype.map.call(d.querySelectorAll(".lib-card .name"), function (e) { return e.textContent.trim(); });
        return n.join("|") === n.slice().sort(function (a, b) { return a.localeCompare(b, "de"); }).join("|");
      });
      pruefe(az, "A–Z: die Workouts sind in den Bereichen nicht alphabetisch");
      klick(".af-az");
      await bis(function () { return !$(".af-az.on"); }, 2000, "A–Z aus");
      klick('[data-kattab="uebungen"]');
      await bis(function () { return $(".sp-leiste[data-surprise]") && $$("[data-studio]").length > 150; }, 3000, "Überrasch mich auch im Reiter Übungen");
      var ug = $$("details.kat-gr");
      pruefe(ug.length >= 7 && ug.every(function (d) { return !d.open && sichtbar(d); }), "Übungen: zu Beginn sollen nur die Überschriften stehen (" + ug.length + " Bereiche)");
      klick('[data-kattab="meine"]');
      await bis(function () { return $(".sp-leiste[data-surprise]") && !$("#l-q") && $(".plan-item, .fav-empty"); }, 3000, "Überrasch mich auch im Reiter Meine");
      klick('[data-kattab="workouts"]');
    }],
    ["Suche: „pull ups“, „klimmzug“, „liegestutz“", async function () {
      klick('[data-kattab="uebungen"]');
      var q = await bis(function () { return $("#st-q"); }, 3000, "Suchfeld");
      function namen(x) { eingeben(q, x); return $$(".fig-karte").filter(sichtbar).map(function (c) { return (c.querySelector(".fig-name") || {}).textContent || ""; }); }
      pruefe(namen("pull ups").indexOf("Pull-ups") > -1, "„pull ups“ findet Pull-ups nicht");
      pruefe(namen("klimmzug").length >= 5, "„klimmzug“ findet zu wenig");
      pruefe(namen("liegestutz").indexOf("Push-ups") > -1, "„liegestutz“ findet Push-ups nicht");
      eingeben(q, "");
      pruefe($$("[data-studio]").filter(function (c) { return c.style.display !== "none"; }).length > 150, "ohne Suche zu wenige Übungen");
      pruefe($$("details.kat-gr").every(function (d) { return !d.open; }), "nach der Suche stehen die Bereiche nicht wieder zugeklappt da");
    }],
    ["Übungsinfo: Pull-ups mit zwei Ansichten", async function () {
      klick('[data-studio="pull-ups"]');
      klick(await bis(function () { return $("[data-stinfo]"); }, 3000, "Info-Knopf auf der Karte"));
      await bis(function () { return $$(".info-views figure").length === 2; }, 3000, "zwei Ansichten");
      klick("[data-close]");
      klick("button.back");
      await bis(function () { return $("#st-q"); }, 3000, "zurück im Katalog");
    }],
    ["Körperkarte: Gruppe antippen filtert die Übungen, Info mit Silhouetten, Auswertung mit Summe", async function () {
      await heim();
      klick('[data-nav="#katalog"]');
      klick(await bis(function () { return $('[data-kattab="uebungen"]'); }, 3000, "Reiter Übungen"));
      await bis(function () { return $$("[data-studio]").length > 150; }, 3000, "Übungen im Katalog");
      var alle = $$("[data-studio]").length;
      await filterAuf();
      pruefe($$(".kk-filter .kk").length === 2 && $$("[data-stzone]").length >= 12, "Körperkarte im Filter fehlt");
      klick('.fc-chip[data-stzone="brust"]');
      await bis(function () { return $('.fc-chip[data-stzone="brust"].on') && $(".af-body"); }, 2000, "Brust gewählt, Karte bleibt offen");
      var brust = $$("[data-studio]").length;
      pruefe(brust > 0 && brust < alle, "Filter Brust: " + brust + " von " + alle);
      pruefe(!$('[data-studio="air-squats"]') && $('[data-studio="push-ups"]') && $('[data-studio="chest-press-machine"]'), "Brust-Filter zeigt falsche Übungen (Air und Studio gemeinsam)");
      klick('[data-streset]');
      await bis(function () { return $$("[data-studio]").length === alle; }, 2000, "zurückgesetzt");
      // Detailansicht: an = 21 Zonen, größer; die Auswahl wandert mit; danach wieder aus (10 Zonen)
      pruefe($('.kk-modus button[role="switch"][aria-checked="false"]') && $$(".kk-chips .fc-chip").length === 10, "Detailansicht ist nicht standardmäßig aus (10 Zonen)");
      klick('[data-kkmodus="fein"]');
      await bis(function () { return $$(".kk-chips .fc-chip").length === 21 && $(".kk-paar.fein") && $(".kk-modus button[aria-checked=\"true\"]") && $(".af-body"); }, 2000, "Detailansicht an (21 Zonen)");
      klick('.fc-chip[data-stzone="schulter_h"]');
      await bis(function () { var n = $$("[data-studio]").length; return $('.fc-chip[data-stzone="schulter_h"].on') && n > 0 && n < alle; }, 2000, "Filter Hintere Schulter");
      klick('[data-kkmodus="grob"]');
      await bis(function () { return $$(".kk-chips .fc-chip").length === 10 && $('.fc-chip[data-stzone="schulter"].on'); }, 2000, "Detailansicht aus: Auswahl wird zu Schultern");
      klick('[data-streset]');
      await bis(function () { return $$("[data-studio]").length === alle; }, 2000, "zurückgesetzt (Detailansicht aus)");
      klick(".af-fuss .btn-primary");
      klick(await bis(function () { return $('[data-studio="band-squat"]'); }, 2000, "Kachel Kniebeuge mit Band"));
      klick(await bis(function () { return $("[data-stinfo]"); }, 3000, "Info auf der Karte"));
      await bis(function () { return $(".info-kk-knopf .kk"); }, 2000, "Silhouetten in der Übungsinfo");
      pruefe($$(".info-kk-knopf .z.an").length > 0, "keine Muskelgruppe gefärbt");
      klick("[data-kkgross]");
      await bis(function () { return $(".info-mus.gross") && $(".info-kk-liste") && !$(".info-kk-liste").hidden; }, 2000, "Silhouetten groß mit Namen");
      klick("[data-close]");
      klick("button.back");
      klick(await bis(function () { return $('[data-kattab="workouts"]'); }, 3000, "Reiter Workouts"));
      klick(await bis(function () { return $("[data-cover]"); }, 3000, "Workout"));
      await bis(function () { return $(".ausw .kk-summe .kk"); }, 3000, "Körperkarte in der Auswertung");
      pruefe($$(".cover-hero .kk-kopf .kk").length === 2 && $(".cover-hero .kk-kopf .kk-zeile"), "Körperkarte oben im Workout-Deckblatt fehlt");
      // Suche: Körperkarte aufklappen, Muskelgruppe wählen -> nur passende Übungen
      await heim();
      klick('.tabbar [data-nav="#search"]');
      await bis(function () { return $("[data-srkk]"); }, 3000, "Suche mit Körper-Zeile");
      klick("[data-srkk]");
      klick(await bis(function () { return $('.fc-chip[data-srzone="ruecken"]'); }, 2000, "Körperkarte in der Suche"));
      await bis(function () { return $('.fc-chip[data-srzone="ruecken"].on') && $$("[data-playex]").length > 5; }, 2000, "Rücken-Übungen als Kacheln in der Suche");
      pruefe($$("[data-playex]").length < 140 && $$(".air-kachel").length === $$("[data-playex]").length, "Rücken-Filter filtert nicht oder Kacheln fehlen");
      pruefe($$(".st-kachel[data-studio]").length > 5, "Rücken-Filter: Studio-Übungen fehlen als Kacheln");
      pruefe($$(".air-kachel [data-playex]").length + $$("[data-info]").length > 0 && $$("[data-info]").some(function (el) { var e = W.findExercise(el.getAttribute("data-info")); return e && e.main === "stretch"; }), "Rücken-Filter: Dehnübungen fehlen als Kacheln");
      await heim();   // zurück in den Katalog, wie der nächste Test ihn erwartet
      klick('[data-nav="#katalog"]');
      await bis(function () { return $("[data-surprise]"); }, 3000, "Katalog");
    }],
    ["Widerstandsband: 38 Übungen vollständig (zwei Posen, Anleitung, Haltung, Muskeln, Gerät)", async function () {
      var d = W.BLOC_DATEN, ids = d.EXERCISE_ROWS.map(function (x) { return x[0]; }).filter(function (id) { return id.indexOf("band-") === 0; });
      pruefe(ids.length === 38, "erwartet 38 Band-Übungen, gefunden " + ids.length);
      ids.forEach(function (id) {
        var p = d.ILLU_POSES[id], i = d.EX_INFO[id], h = d.EX_POSTURE[id], m = d.EX_MUSCLES[id];
        pruefe(p && p[0] && p[1], "Figur fehlt: " + id);
        pruefe(i && i.length === 2 && i[0].split("|").length === 3 && i[1].split("|").length === 3, "Anleitung (3 Schritte, DE/EN) fehlt: " + id);
        pruefe(h && h.length === 4 && h.every(Boolean), "Haltung fehlt: " + id);
        pruefe(m && m.length === 4 && m.every(Boolean), "Muskeln fehlen: " + id);
        pruefe(d.EX_EQUIP[id].split(" ").indexOf("band") > -1, "Gerät fehlt: " + id);
      });
      var unb = W.BLOC_DEV ? W.BLOC_DEV.kkUnbekannt() : null;
      pruefe(unb && unb.length === 0, "Muskelnamen ohne Zone: " + (unb ? unb.join(", ") : "BLOC_DEV fehlt"));
      pruefe(d.LIB_WORKOUT_ROWS.filter(function (x) { return x[0].indexOf("band-") === 0; }).every(function (x) {
        return x[4].split(" ").every(function (id) { return d.EXERCISE_ROWS.some(function (r) { return r[0] === id; }); });
      }), "ein Band-Workout enthält eine unbekannte Übung");
    }],
    ["Überrasch mich: ohne Stretch, erzeugt ein Workout", async function () {
      klick("[data-surprise]");
      await bis(function () { return $("[data-spgo]"); }, 3000, "Einstellungen");
      pruefe(!$('[data-spmain="stretch"]'), "Stretch-Kachel ist noch da");
      pruefe($$("[data-spmain]").length === 4, "erwartet 4 Kategorie-Kacheln");
      klick("[data-spgo]");
      await bis(function () { return $$(".wb-ablauf").length >= 2; }, 3000, "Übungen im Deckblatt");
      var vorher = $$(".wb-ablauf .fig-name").map(function (x) { return x.textContent; }).join();
      klick("[data-reroll]");
      await bis(function () { return $$(".wb-ablauf .fig-name").map(function (x) { return x.textContent; }).join() !== vorher; }, 3000, "„Nochmal mischen“ ändert das Workout");
    }],
    ["Timer: Übungs-Kreise, Satz blinkt in der Pause, Figur in der Blockpause", async function () {
      await heim();
      klick('[data-nav="#katalog"]');
      klick(await bis(function () { return $('[data-kattab="workouts"]'); }, 3000, "Reiter Workouts"));
      klick(await bis(function () { return $("[data-cover]"); }, 3000, "Workout"));
      klick(await bis(function () { return $("[data-go]"); }, 3000, "Los geht's"));
      await bis(function () { return $("#playerEl"); }, 3000, "Timer");
      pruefe($$("#pl-exdots span").length >= 2, "Übungs-Kreise fehlen");
      pruefe(!$("#pl-counter"), "alter Zähler „1 / 27“ ist wieder da");
      function phase() { return $("#playerEl").getAttribute("data-phase"); }
      var n = 0;
      while (phase() !== "work" && n++ < 5) klick("[data-skip]");
      klick("[data-skip]");
      pruefe(phase() === "rest", "nach dem ersten Satz keine Pause, sondern " + phase());
      var cls = $$("#pl-dots span").map(function (s) { return s.className; });
      pruefe(cls[0] === "done" && cls[1] === "now", "in der Pause sollte Satz 2 blinken: " + cls.join(","));
      n = 0;
      while (phase() !== "blockrest" && phase() !== "done" && n++ < 60) klick("[data-skip]");
      pruefe(phase() === "blockrest", "keine Blockpause gefunden");
      pruefe($(".ring-wrap.mit-figur .pl-vorschau"), "in der Blockpause fehlt die Figur im Ring");
      pruefe($('#pl-exdots span.now.bald'), "kommende Übung pulsiert nicht");
      klick("[data-exit]");
      klick(await bis(function () { return $("#overlayRoot [data-ok]"); }, 2000, "Beenden bestätigen"));
      await bis(function () { return !$("#playerEl"); }, 3000, "Timer schließt");
    }],
    ["Summit (Challenges): Reiter, Mengen auf den Karten", async function () {
      await heim();
      klick('[data-nav="#reps"]');
      await bis(function () { return $$("[data-repf^='tab:']").length === 3; }, 3000, "drei Reiter");
      klick('[data-repf="tab:einheiten"]');
      pruefe($$(".rep-karte .rep-plan").length >= 10, "Karten zeigen keine Mengen");
    }],
    ["Eigene Challenge: anlegen, Übung wählen, durchspielen, löschen", async function () {
      klick('[data-repf="tab:meine"]');
      klick(await bis(function () { return $("[data-fab]"); }, 3000, "Plus unter Meine"));
      klick(await bis(function () { return $('[data-fabopt="prog"]'); }, 3000, "Neues Programm"));
      klick(await bis(function () { return $("[data-readd]"); }, 3000, "Editor"));
      await bis(function () { return $('[data-repick="burpees"]'); }, 3000, "Übungsauswahl");
      pruefe(!$('[data-repick="leg-press"]') && !$('[data-repick="cobra-lift"]'), "Studio- oder Dehnübung in der Challenge-Auswahl");
      klick($('[data-repick="burpees"]'));
      var f0 = await bis(function () { return $('[data-rem="0:0"]'); }, 3000, "Mengenfelder");
      f0.value = "5"; f0.dispatchEvent(new W.Event("change"));
      pruefe($('[data-rem="0:2"]').value === "5", "Runde 1 überträgt sich nicht auf Runde 3");
      klick("[data-refertig]");
      await bis(function () { return $(".rep-tab"); }, 3000, "Übersicht mit Tabelle");
      klick("[data-repstart]");

        { at: n - 50 * D, dur: 900, ex: ["a"], b: "lib" }, { at: n - 50 * D + 20 * M, dur: 900, ex: ["b"], b: "lib" }                                                                  // älter als 31 Tage: ein Besuch im Archiv
      ];
      db.settings = db.settings || {}; db.settings.statW = {}; db.settings.fokusAus = []; db.settings.runs = [];
      W.localStorage.setItem(KEY, JSON.stringify(db));
      await heim();
      klick('.tabbar [data-nav="#stats"]');
      await bis(function () { return $(".sr-mitte b"); }, 3000, "Statistik");
      var erwartet = new Date().getDay() === 1 ? "1" : "2";   // diese Woche (ab Montag): montags liegt der Vortag in der Vorwoche
      pruefe($(".sr-mitte b").textContent === erwartet, "drei Timer in 40 Minuten sind ein Training: " + $(".sr-mitte b").textContent);
      pruefe(/^(40|60)$/.test($(".stat-karte .bchart .bc.jetzt .bw").textContent), "Zeit der laufenden Woche sollte 60 min sein (40 + 20), montags nur 40: " + $(".stat-karte .bchart .bc.jetzt .bw").textContent);
      klick('[data-statgran="monat"]');
      await bis(function () { return $(".stat-karte .bchart .bc small") && /\d\d$/.test($(".stat-karte .bchart .bc small").textContent); }, 2000, "Monatsansicht");
      klick('[data-statgran="jahr"]');
      await bis(function () { return /^20\d\d$/.test($(".stat-karte .bchart .bc small").textContent); }, 2000, "Jahresansicht");
      klick('[data-statgran="woche"]');
      await bis(function () { return $(".stat-karte .bchart .bc.jetzt"); }, 2000, "Wochenansicht");
      klick('.tabbar [data-nav="#settings"]');   // eine Änderung speichern, damit der Stand (inkl. Archiv) in den Speicher kommt
      klick(await bis(function () { return $('[data-fokus="warm"]'); }, 3000, "Fokus")); klick($('[data-fokus="warm"]'));
      var sw = JSON.parse(W.localStorage.getItem(KEY)).settings.statW;
      var wo = Object.keys(sw)[0];
      pruefe(wo && sw[wo].bn === 1 && sw[wo].bs === 2100, "alte Einträge sollten als ein Besuch von 35 min archiviert sein: " + JSON.stringify(sw));
      klick('.tabbar [data-nav="#home"]');
      await bis(function () { return $(".woche") && /[12] Training/.test($(".woche").getAttribute("aria-label")); }, 3000, "Wochenzeile zählt Besuche");
    }],
    ["Kleine Hilfen: „Was ist was?“, Bestleistung, Leichter/Schwerer", async function () {
      function daten() { return JSON.parse(W.localStorage.getItem(KEY)); }
      await heim();
      klick(await bis(function () { return $("[data-wasistwas]"); }, 3000, "Link „Was ist was?“"));
      await bis(function () { return $$("#overlayRoot .wi-zeile").length === 5; }, 2000, "fünf Zeilen Klartext");
      klick($("#overlayRoot [data-ok]"));
      await bis(function () { return !$("#overlayRoot .wi-zeile"); }, 2000, "Hinweis schließt");
      // Bestleistung: vorheriges Bestgewicht vorgeben, dann einen Satz darüber eintragen
      var db = daten(); db.settings.studio = db.settings.studio || {};
      db.settings.stGruppen = []; db.settings.stArten = []; db.settings.katTab = "uebungen";   // keine Filter aus früheren Tests
      db.settings.studio["leg-press"] = { log: [{ at: Date.now() - 3 * 86400000, s: [[100, 10]] }], kg: 100, zuletzt: Date.now() - 3 * 86400000 };
      W.localStorage.setItem(KEY, JSON.stringify(db));
      await heim();
      klick('[data-nav="#katalog"]');
      klick(await bis(function () { return $('[data-kattab="uebungen"]'); }, 3000, "Reiter Übungen im Katalog"));
      klick(await bis(function () { return $('[data-studio="leg-press"]'); }, 3000, "Kachel Beinpresse"));
      var kg = await bis(function () { return $("#st-kg"); }, 3000, "Studio-Karte");
      kg.value = "105"; kg.dispatchEvent(new W.Event("input", { bubbles: true })); kg.dispatchEvent(new W.Event("change", { bubbles: true }));
      klick("[data-stset]");
      await bis(function () { return $(".st-pr") && /Neue Bestleistung/.test($(".st-pr").textContent) && /vorher 100/.test($(".st-pr").textContent); }, 3000, "Bestleistung wird gemeldet");
      klick("[data-stundo]");
      await bis(function () { return !$(".st-pr"); }, 3000, "Hinweis weg nach „Letzten Satz löschen“");
    }],
    ["Keine Skriptfehler", async function () {
      pruefe(!fehler.length, fehler.slice(0, 3).join(" | "));
    }]
  ];

  function eintrag(name) { var li = document.createElement("li"); li.textContent = name + " …"; liste.appendChild(li); return li; }

  document.getElementById("los").addEventListener("click", async function () {
    var knopf = this;
    if (!lokal) { summe.className = "fail"; summe.textContent = "Nur lokal ausführen (localhost) – sonst würde der Test deinen echten Stand anfassen."; return; }
    knopf.disabled = true; liste.innerHTML = ""; summe.textContent = ""; fehler = [];
    var gesichert = localStorage.getItem(KEY), ss = {};
    for (var i = 0; i < sessionStorage.length; i++) { var k = sessionStorage.key(i); ss[k] = sessionStorage.getItem(k); }
    localStorage.removeItem(KEY);   // frischer Stand, damit der Test immer gleich läuft
    var ok = 0, schlecht = 0;
    try {
      for (var t = 0; t < TESTS.length; t++) {
        var li = eintrag(TESTS[t][0]);
        try { await TESTS[t][1](); li.className = "ok"; li.textContent = "✓ " + TESTS[t][0]; ok++; }
        catch (e) {
          li.className = "fail"; li.textContent = "✗ " + TESTS[t][0];
          var sm = document.createElement("small"); sm.textContent = e && e.message ? e.message : String(e); li.appendChild(sm);
          schlecht++;
        }
      }
    } finally {
      iframe.src = "about:blank";
      await warte(200);
      if (gesichert === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, gesichert);
      sessionStorage.clear(); Object.keys(ss).forEach(function (k) { sessionStorage.setItem(k, ss[k]); });
      summe.className = schlecht ? "fail" : "ok";
      summe.textContent = schlecht ? schlecht + " von " + TESTS.length + " Prüfungen fehlgeschlagen" : "Alles in Ordnung: " + ok + " von " + TESTS.length + " Prüfungen bestanden";
      document.title = (schlecht ? "✗ " : "✓ ") + "BLOC Schnelltest";
      knopf.disabled = false;
    }
  });
  if (/[?&]auto\b/.test(location.search)) document.getElementById("los").click();
})();
</script>
